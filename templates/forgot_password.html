{% extends "base.html" %}

{% block title %}Reset Password - MEDExplain AI{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Forgot Password?</h1>
            <p class="auth-subtitle">Enter your account email to receive reset instructions.</p>
        </div>

        <form action="{{ url_for('forgot_password') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email" class="form-label">Email address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            <p>Remembered your password? <a href="{{ url_for('login') }}" class="auth-link">Sign in</a></p>
        </div>
    </div>
</div>
{% endblock %}
