{% extends 'base.html' %}

{% block title %}Settings - Generative AI Medical Report Explainer{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 600px;">
    <div class="auth-header">
        <h2>Account & Preferences</h2>
        <p>Manage your profile and default explanation language</p>
    </div>

    <form action="{{ url_for('settings') }}" method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" value="{{ user.email }}" disabled style="background: #f1f5f9;">
            <small style="color: var(--slate-muted); font-size: 0.8rem;">Email cannot be changed.</small>
        </div>

        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" class="form-control" value="{{ user.full_name }}" required>
        </div>

        <div class="form-group">
            <label for="preferred_language">Default Explanation Language</label>
            <select id="preferred_language" name="preferred_language" class="form-control">
                {% for code, name in languages.items() %}
                    <option value="{{ code }}" {% if code == user.preferred_language %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Authentication Type</label>
            <div style="padding: 0.75rem; background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600; text-transform: capitalize;">
                🔑 {{ user.auth_provider or 'local' }} Authentication
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Save Settings</button>
    </form>
</div>
{% endblock %}
