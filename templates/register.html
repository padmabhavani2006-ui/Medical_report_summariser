{% extends 'base.html' %}

{% block title %}Create Account - Generative AI Medical Report Explainer{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Start translating medical jargon into plain language</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Dr. / Mr. / Ms. Jane Doe" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
            <label for="preferred_language">Preferred Explanation Language</label>
            <select id="preferred_language" name="preferred_language" class="form-control">
                {% for code, name in languages.items() %}
                    <option value="{{ code }}" {% if code == 'en' %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Create Account</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--slate-muted);">
        Already have an account? <a href="{{ url_for('login') }}" style="font-weight: 600;">Sign In</a>
    </div>
</div>
{% endblock %}
